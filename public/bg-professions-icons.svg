<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" fill="none">
  <defs>
    <linearGradient id="iBg" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stopColor="#020617" stopOpacity="1"/>
      <stop offset="40%" stopColor="#020617" stopOpacity="0.5"/>
      <stop offset="100%" stopColor="#020617" stopOpacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="glowBig">
      <feGaussianBlur stdDeviation="35"/>
    </filter>
  </defs>

  <!-- Base -->
  <rect width="1920" height="1080" fill="#020617"/>

  <!-- Ambient glows -->
  <circle cx="960" cy="350" r="400" fill="#10B981" opacity="0.05" filter="url(#glowBig)"/>
  <circle cx="300" cy="500" r="250" fill="#059669" opacity="0.04" filter="url(#glowBig)"/>
  <circle cx="1600" cy="300" r="200" fill="#34D399" opacity="0.04" filter="url(#glowBig)"/>

  <!-- Row 1: Profession icons at top -->
  <g opacity="0.5">
    <!-- Code bracket -->
    <g transform="translate(250, 220)">
      <text text-anchor="middle" fontFamily="monospace" fontSize="56" fill="#10B981" opacity="0.4">&lt;/&gt;</text>
    </g>
    <!-- Medical cross -->
    <g transform="translate(480, 200)">
      <rect x="-5" y="-28" width="10" height="56" rx="3" fill="#34D399" opacity="0.3"/>
      <rect x="-28" y="-5" width="56" height="10" rx="3" fill="#34D399" opacity="0.3"/>
    </g>
    <!-- Palette -->
    <g transform="translate(720, 240)">
      <circle cx="0" cy="0" r="26" stroke="#10B981" strokeWidth="1.5" fill="none" opacity="0.35"/>
      <circle cx="0" cy="0" r="22" stroke="#10B981" strokeWidth="0.5" fill="none" opacity="0.15"/>
      <circle cx="8" cy="-12" r="5" fill="#6EE7B7" opacity="0.3"/>
      <circle cx="-10" cy="10" r="4" fill="#34D399" opacity="0.3"/>
      <circle cx="12" cy="10" r="3" fill="#059669" opacity="0.25"/>
    </g>
    <!-- Gear -->
    <g transform="translate(960, 180)">
      <circle cx="0" cy="0" r="22" stroke="#34D399" strokeWidth="1.5" fill="none" opacity="0.35"/>
      <circle cx="0" cy="0" r="10" fill="#10B981" opacity="0.15"/>
      <!-- Gear teeth -->
      <rect x="-4" y="-28" width="8" height="8" rx="1" fill="#34D399" opacity="0.25"/>
      <rect x="-4" y="20" width="8" height="8" rx="1" fill="#34D399" opacity="0.25"/>
      <rect x="-28" y="-4" width="8" height="8" rx="1" fill="#34D399" opacity="0.25"/>
      <rect x="20" y="-4" width="8" height="8" rx="1" fill="#34D399" opacity="0.25"/>
    </g>
    <!-- Chart bars -->
    <g transform="translate(1200, 230)">
      <rect x="-16" y="5" width="10" height="20" rx="2" fill="#6EE7B7" opacity="0.2"/>
      <rect x="-3" y="-5" width="10" height="30" rx="2" fill="#10B981" opacity="0.25"/>
      <rect x="10" y="10" width="10" height="15" rx="2" fill="#34D399" opacity="0.2"/>
    </g>
    <!-- Lightbulb -->
    <g transform="translate(1440, 200)">
      <ellipse cx="0" cy="-10" rx="16" ry="18" stroke="#10B981" strokeWidth="1.2" fill="none" opacity="0.3"/>
      <rect x="-6" y="8" width="12" height="3" rx="1.5" fill="#10B981" opacity="0.2"/>
      <rect x="-3" y="13" width="6" height="3" rx="1.5" fill="#10B981" opacity="0.15"/>
    </g>
    <!-- Star -->
    <g transform="translate(1680, 250)">
      <polygon points="0,-22 6,-8 20,-8 9,3 13,18 0,10 -13,18 -9,3 -20,-8 -6,-8" fill="#34D399" opacity="0.2"/>
    </g>
  </g>

  <!-- Row 2: More icons -->
  <g opacity="0.45">
    <!-- Person/User -->
    <g transform="translate(350, 480)">
      <circle cx="0" cy="-14" r="12" stroke="#10B981" strokeWidth="1" fill="none" opacity="0.3"/>
      <path d="M-18 25 Q-18 10 0 10 Q18 10 18 25" stroke="#10B981" strokeWidth="1" fill="none" opacity="0.25"/>
    </g>
    <!-- Rocket -->
    <g transform="translate(600, 520)">
      <path d="M0 28 L-8 10 L0 -22 L8 10 Z" stroke="#34D399" strokeWidth="1" fill="none" opacity="0.3"/>
      <path d="M-4 -4 Q0 2 4 -4" stroke="#6EE7B7" strokeWidth="0.5" fill="none" opacity="0.2"/>
    </g>
    <!-- Target -->
    <g transform="translate(850, 450)">
      <circle cx="0" cy="0" r="22" stroke="#10B981" strokeWidth="1" fill="none" opacity="0.25"/>
      <circle cx="0" cy="0" r="14" stroke="#34D399" strokeWidth="0.8" fill="none" opacity="0.2"/>
      <circle cx="0" cy="0" r="6" fill="#10B981" opacity="0.15"/>
    </g>
    <!-- Graph line -->
    <g transform="translate(1100, 500)">
      <polyline points="-24,20 -12,10 0,14 12,-4 24,0" stroke="#34D399" strokeWidth="1.5" fill="none" opacity="0.25"/>
      <circle cx="12" cy="-4" r="4" fill="#10B981" opacity="0.2"/>
    </g>
    <!-- Brain/Head -->
    <g transform="translate(1350, 460)">
      <path d="M-15 0 C-15 -15 0 -22 15 -15 C22 -8 22 5 15 10 L-10 10 Z" stroke="#6EE7B7" strokeWidth="1" fill="none" opacity="0.25"/>
      <path d="M-8 5 Q0 12 8 5" stroke="#6EE7B7" strokeWidth="0.5" fill="none" opacity="0.15"/>
    </g>
    <!-- Heart -->
    <g transform="translate(1580, 520)">
      <path d="M0 8 C-14 -6 -22 -14 -12 -22 C-5 -27 0 -18 0 -18 C0 -18 5 -27 12 -22 C22 -14 14 -6 0 8Z" stroke="#10B981" strokeWidth="1" fill="none" opacity="0.2"/>
    </g>
  </g>

  <!-- Connection lines between icons -->
  <g opacity="0.12">
    <line x1="250" y1="220" x2="480" y2="200" stroke="#10B981" strokeWidth="1"/>
    <line x1="480" y1="200" x2="720" y2="240" stroke="#34D399" strokeWidth="1"/>
    <line x1="720" y1="240" x2="960" y2="180" stroke="#10B981" strokeWidth="1"/>
    <line x1="960" y1="180" x2="1200" y2="230" stroke="#34D399" strokeWidth="1"/>
    <line x1="1200" y1="230" x2="1440" y2="200" stroke="#10B981" strokeWidth="1"/>
    <line x1="1440" y1="200" x2="1680" y2="250" stroke="#6EE7B7" strokeWidth="1"/>
    
    <line x1="350" y1="480" x2="600" y2="520" stroke="#10B981" strokeWidth="0.8"/>
    <line x1="600" y1="520" x2="850" y2="450" stroke="#34D399" strokeWidth="0.8"/>
    <line x1="850" y1="450" x2="1100" y2="500" stroke="#10B981" strokeWidth="0.8"/>
    <line x1="1100" y1="500" x2="1350" y2="460" stroke="#6EE7B7" strokeWidth="0.8"/>
    <line x1="1350" y1="460" x2="1580" y2="520" stroke="#10B981" strokeWidth="0.8"/>
  </g>

  <!-- Small decorative dots -->
  <g opacity="0.2">
    <circle cx="100" cy="350" r="2" fill="#10B981"/>
    <circle cx="1800" cy="150" r="2" fill="#34D399"/>
    <circle cx="1850" cy="650" r="2" fill="#6EE7B7"/>
    <circle cx="400" cy="700" r="2" fill="#10B981"/>
    <circle cx="1700" cy="750" r="2" fill="#059669"/>
    <circle cx="100" cy="700" r="1.5" fill="#34D399"/>
    <circle cx="650" cy="800" r="1.5" fill="#10B981"/>
  </g>

  <!-- Bottom fade -->
  <rect x="0" y="650" width="1920" height="430" fill="url(#iBg)"/>
</svg>

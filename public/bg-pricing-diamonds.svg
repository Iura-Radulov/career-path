<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" fill="none">
  <defs>
    <linearGradient id="dBg" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stopColor="#020617" stopOpacity="1"/>
      <stop offset="35%" stopColor="#020617" stopOpacity="0.4"/>
      <stop offset="100%" stopColor="#020617" stopOpacity="0"/>
    </linearGradient>
    <linearGradient id="diamondFill1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stopColor="#34D399" stopOpacity="0.15"/>
      <stop offset="60%" stopColor="#10B981" stopOpacity="0.04"/>
      <stop offset="100%" stopColor="#059669" stopOpacity="0.02"/>
    </linearGradient>
    <linearGradient id="diamondFill2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#6EE7B7" stopOpacity="0.1"/>
      <stop offset="50%" stopColor="#10B981" stopOpacity="0.05"/>
      <stop offset="100%" stopColor="#059669" stopOpacity="0.02"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="glowBig">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>

  <!-- Base -->
  <rect width="1920" height="1080" fill="#020617"/>

  <!-- Ambient glows -->
  <circle cx="960" cy="300" r="350" fill="#10B981" opacity="0.06" filter="url(#glowBig)"/>
  <circle cx="200" cy="250" r="200" fill="#34D399" opacity="0.04" filter="url(#glowBig)"/>
  <circle cx="1700" cy="600" r="250" fill="#059669" opacity="0.04" filter="url(#glowBig)"/>

  <!-- Large diamond - center hero -->
  <g transform="translate(960, 280)" opacity="0.6">
    <polygon points="0,-140 85,0 0,140 -85,0" stroke="url(#diamondFill1)" strokeWidth="1.5" fill="url(#diamondFill1)"/>
    <!-- Facet lines -->
    <line x1="0" y1="-140" x2="0" y2="140" stroke="#34D399" strokeWidth="0.8" opacity="0.4"/>
    <line x1="-85" y1="0" x2="85" y2="0" stroke="#10B981" strokeWidth="0.8" opacity="0.35"/>
    <line x1="-42" y1="-70" x2="42" y2="70" stroke="#6EE7B7" strokeWidth="0.5" opacity="0.25"/>
    <line x1="42" y1="-70" x2="-42" y2="70" stroke="#6EE7B7" strokeWidth="0.5" opacity="0.25"/>
    <!-- Sparkle -->
    <circle cx="0" cy="-140" r="4" fill="#6EE7B7" opacity="0.6" filter="url(#glow)"/>
  </g>

  <!-- Medium diamond - left -->
  <g transform="translate(250, 300)" opacity="0.45">
    <polygon points="0,-100 60,0 0,100 -60,0" stroke="#34D399" strokeWidth="1.2" fill="url(#diamondFill2)"/>
    <line x1="0" y1="-100" x2="0" y2="100" stroke="#10B981" strokeWidth="0.6" opacity="0.3"/>
    <line x1="-60" y1="0" x2="60" y2="0" stroke="#10B981" strokeWidth="0.6" opacity="0.25"/>
    <circle cx="0" cy="-100" r="3" fill="#10B981" opacity="0.5" filter="url(#glow)"/>
  </g>

  <!-- Medium diamond - right -->
  <g transform="translate(1620, 450)" opacity="0.4">
    <polygon points="0,-110 68,0 0,110 -68,0" stroke="#10B981" strokeWidth="1.2" fill="url(#diamondFill1)"/>
    <line x1="0" y1="-110" x2="0" y2="110" stroke="#34D399" strokeWidth="0.6" opacity="0.3"/>
    <circle cx="0" cy="-110" r="3" fill="#34D399" opacity="0.5" filter="url(#glow)"/>
  </g>

  <!-- Small diamonds scattered -->
  <g opacity="0.35">
    <g transform="translate(150, 600)">
      <polygon points="0,-40 24,0 0,40 -24,0" stroke="#6EE7B7" strokeWidth="0.8" fill="none"/>
      <circle cx="0" cy="-40" r="2" fill="#6EE7B7" opacity="0.4"/>
    </g>
    <g transform="translate(500, 650)">
      <polygon points="0,-35 22,0 0,35 -22,0" stroke="#10B981" strokeWidth="0.7" fill="none"/>
    </g>
    <g transform="translate(1350, 220)">
      <polygon points="0,-30 18,0 0,30 -18,0" stroke="#34D399" strokeWidth="0.7" fill="none"/>
    </g>
    <g transform="translate(1800, 250)">
      <polygon points="0,-28 17,0 0,28 -17,0" stroke="#6EE7B7" strokeWidth="0.6" fill="none"/>
    </g>
    <g transform="translate(780, 150)">
      <polygon points="0,-25 15,0 0,25 -15,0" stroke="#10B981" strokeWidth="0.6" fill="none"/>
    </g>
    <g transform="translate(1150, 600)">
      <polygon points="0,-30 18,0 0,30 -18,0" stroke="#34D399" strokeWidth="0.7" fill="none"/>
    </g>
  </g>

  <!-- Sparkle dots -->
  <g opacity="0.5">
    <circle cx="960" cy="120" r="2" fill="#6EE7B7"/>
    <circle cx="960" cy="440" r="2" fill="#34D399"/>
    <circle cx="880" cy="280" r="1.5" fill="#10B981"/>
    <circle cx="1040" cy="280" r="1.5" fill="#10B981"/>
    <circle cx="250" cy="180" r="2" fill="#6EE7B7"/>
    <circle cx="250" cy="420" r="1.5" fill="#34D399"/>
    <circle cx="1620" cy="320" r="2" fill="#10B981"/>
    <circle cx="1620" cy="580" r="1.5" fill="#34D399"/>
    <circle cx="150" cy="540" r="1.5" fill="#10B981"/>
    <circle cx="780" cy="110" r="1.5" fill="#34D399"/>
    <circle cx="1350" cy="170" r="1.5" fill="#10B981"/>
    <circle cx="1800" cy="210" r="1.5" fill="#6EE7B7"/>
  </g>

  <!-- Premium horizontal accent lines -->
  <g opacity="0.15">
    <line x1="400" y1="160" x2="760" y2="160" stroke="#10B981" strokeWidth="0.5"/>
    <line x1="1150" y1="160" x2="1500" y2="160" stroke="#34D399" strokeWidth="0.5"/>
    <line x1="300" y1="550" x2="700" y2="550" stroke="#6EE7B7" strokeWidth="0.4"/>
    <line x1="1250" y1="550" x2="1650" y2="550" stroke="#10B981" strokeWidth="0.4"/>
  </g>

  <!-- Bottom fade -->
  <rect x="0" y="600" width="1920" height="480" fill="url(#dBg)"/>
</svg>

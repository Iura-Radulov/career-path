<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" fill="none">
  <defs>
    <linearGradient id="wBg" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stopColor="#020617" stopOpacity="1"/>
      <stop offset="30%" stopColor="#020617" stopOpacity="0.4"/>
      <stop offset="100%" stopColor="#020617" stopOpacity="0"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stopColor="#059669" stopOpacity="0.05"/>
      <stop offset="25%" stopColor="#10B981" stopOpacity="0.25"/>
      <stop offset="50%" stopColor="#34D399" stopOpacity="0.3"/>
      <stop offset="75%" stopColor="#10B981" stopOpacity="0.2"/>
      <stop offset="100%" stopColor="#059669" stopOpacity="0.05"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stopColor="#059669" stopOpacity="0.03"/>
      <stop offset="30%" stopColor="#10B981" stopOpacity="0.15"/>
      <stop offset="50%" stopColor="#6EE7B7" stopOpacity="0.2"/>
      <stop offset="70%" stopColor="#10B981" stopOpacity="0.15"/>
      <stop offset="100%" stopColor="#059669" stopOpacity="0.03"/>
    </linearGradient>
    <linearGradient id="wave3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stopColor="#10B981" stopOpacity="0.02"/>
      <stop offset="40%" stopColor="#34D399" stopOpacity="0.12"/>
      <stop offset="60%" stopColor="#10B981" stopOpacity="0.1"/>
      <stop offset="100%" stopColor="#059669" stopOpacity="0.02"/>
    </linearGradient>
    <filter id="glowBlur">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="glowBig">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>

  <!-- Base -->
  <rect width="1920" height="1080" fill="#020617"/>

  <!-- Ambient glow -->
  <circle cx="960" cy="400" r="400" fill="#10B981" opacity="0.05" filter="url(#glowBig)"/>
  <circle cx="400" cy="600" r="250" fill="#34D399" opacity="0.03" filter="url(#glowBig)"/>
  <circle cx="1500" cy="300" r="250" fill="#059669" opacity="0.03" filter="url(#glowBig)"/>

  <!-- Wave 1 - top (most visible) -->
  <g opacity="0.5">
    <path d="M0 320 C200 260 400 300 600 260 C800 220 1000 280 1200 240 C1400 200 1600 260 1920 230 L1920 500 L0 500 Z" fill="url(#wave1)"/>
  </g>

  <!-- Glow dots on wave 1 -->
  <g opacity="0.3">
    <circle cx="200" cy="278" r="3" fill="#34D399" filter="url(#glowBlur)"/>
    <circle cx="400" cy="290" r="2" fill="#10B981"/>
    <circle cx="600" cy="242" r="3" fill="#6EE7B7" filter="url(#glowBlur)"/>
    <circle cx="800" cy="240" r="2.5" fill="#10B981"/>
    <circle cx="1000" cy="265" r="3" fill="#34D399" filter="url(#glowBlur)"/>
    <circle cx="1200" cy="228" r="2" fill="#6EE7B7"/>
    <circle cx="1400" cy="215" r="3" fill="#10B981" filter="url(#glowBlur)"/>
    <circle cx="1600" cy="248" r="2.5" fill="#34D399"/>
    <circle cx="1800" cy="240" r="2" fill="#6EE7B7"/>
  </g>

  <!-- Wave 2 - mid -->
  <g opacity="0.4">
    <path d="M0 420 C250 360 450 400 700 350 C950 300 1200 380 1450 330 C1700 280 1850 340 1920 320 L1920 550 L0 550 Z" fill="url(#wave2)"/>
  </g>

  <!-- Glow dots on wave 2 -->
  <g opacity="0.2">
    <circle cx="250" cy="378" r="2.5" fill="#10B981"/>
    <circle cx="700" cy="368" r="2" fill="#34D399"/>
    <circle cx="1200" cy="358" r="2.5" fill="#10B981"/>
    <circle cx="1700" cy="335" r="2" fill="#34D399"/>
  </g>

  <!-- Wave 3 - bottom -->
  <g opacity="0.3">
    <path d="M0 510 C150 460 300 500 500 460 C700 420 900 480 1100 440 C1300 400 1500 460 1700 420 C1850 400 1920 430 1920 430 L1920 600 L0 600 Z" fill="url(#wave3)"/>
  </g>

  <!-- Vertical premium glow bars -->
  <g opacity="0.12">
    <rect x="350" y="180" width="1.5" height="280" fill="#10B981" rx="1"/>
    <rect x="700" y="140" width="1.5" height="360" fill="#34D399" rx="1"/>
    <rect x="1150" y="160" width="1.5" height="320" fill="#10B981" rx="1"/>
    <rect x="1500" y="200" width="1.5" height="260" fill="#34D399" rx="1"/>
  </g>

  <!-- Floating particles -->
  <g opacity="0.3">
    <circle cx="100" cy="200" r="2" fill="#10B981"/>
    <circle cx="450" cy="140" r="2.5" fill="#34D399"/>
    <circle cx="900" cy="110" r="2" fill="#6EE7B7"/>
    <circle cx="1300" cy="130" r="2.5" fill="#10B981"/>
    <circle cx="1800" cy="160" r="2" fill="#34D399"/>
    <circle cx="600" cy="100" r="1.5" fill="#10B981"/>
    <circle cx="1600" cy="120" r="1.5" fill="#6EE7B7"/>
  </g>

  <!-- Bottom fade -->
  <rect x="0" y="650" width="1920" height="430" fill="url(#wBg)"/>
</svg>

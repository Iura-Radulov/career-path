<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#020614"/>
      <stop offset="50%" style="stop-color:#0a1852"/>
      <stop offset="100%" style="stop-color:#050b2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#818cf8;stop-opacity:0.1"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bg)"/>
  <circle cx="600" cy="300" r="300" fill="url(#accent)"/>
  <circle cx="200" cy="100" r="80" fill="#6366f1" fill-opacity="0.08"/>
  <circle cx="1000" cy="500" r="120" fill="#818cf8" fill-opacity="0.06"/>
  <!-- Graduation cap / mortarboard -->
  <g transform="translate(600,270)">
    <polygon points="-50,10 0,-30 50,10 0,25" fill="#6366f1" fill-opacity="0.2" stroke="#6366f1" stroke-opacity="0.3" stroke-width="1.5"/>
    <polygon points="-45,12 0,-24 45,12 0,24" fill="#6366f1" fill-opacity="0.08"/>
    <line x1="0" y1="25" x2="0" y2="50" stroke="#6366f1" stroke-opacity="0.2" stroke-width="1.5"/>
    <ellipse cx="0" cy="55" rx="15" ry="5" fill="#818cf8" fill-opacity="0.1" stroke="#818cf8" stroke-opacity="0.2" stroke-width="1"/>
    <!-- Tassel -->
    <path d="M0 -30 Q10 -20 15 0" fill="none" stroke="#818cf8" stroke-opacity="0.3" stroke-width="1.5"/>
  </g>
  <!-- Open book -->
  <g transform="translate(600,290)">
    <path d="M-50 0 L-50 60 L0 50 L50 60 L50 0 L0 10 Z" fill="none" stroke="#818cf8" stroke-opacity="0.2" stroke-width="1.5"/>
    <line x1="0" y1="10" x2="0" y2="50" stroke="#818cf8" stroke-opacity="0.2" stroke-width="1.5"/>
    <!-- Book lines -->
    <line x1="-35" y1="15" x2="-20" y2="12" stroke="#6366f1" stroke-opacity="0.15" stroke-width="1"/>
    <line x1="-35" y1="25" x2="-15" y2="22" stroke="#6366f1" stroke-opacity="0.15" stroke-width="1"/>
    <line x1="-35" y1="35" x2="-25" y2="33" stroke="#6366f1" stroke-opacity="0.15" stroke-width="1"/>
    <line x1="20" y1="12" x2="35" y2="15" stroke="#6366f1" stroke-opacity="0.15" stroke-width="1"/>
    <line x1="15" y1="22" x2="35" y2="25" stroke="#6366f1" stroke-opacity="0.15" stroke-width="1"/>
  </g>
  <!-- Floating dots -->
  <circle cx="700" cy="190" r="2.5" fill="#818cf8" fill-opacity="0.3"/>
  <circle cx="500" cy="200" r="2" fill="#6366f1" fill-opacity="0.25"/>
  <circle cx="730" cy="360" r="2" fill="#818cf8" fill-opacity="0.2"/>
  
</svg>
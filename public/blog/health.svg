<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0a0a"/>
      <stop offset="50%" style="stop-color:#4c1020"/>
      <stop offset="100%" style="stop-color:#1a0510"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f43f5e;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#fb7185;stop-opacity:0.1"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bg)"/>
  <circle cx="600" cy="300" r="300" fill="url(#accent)"/>
  <circle cx="200" cy="100" r="80" fill="#f43f5e" fill-opacity="0.08"/>
  <circle cx="1000" cy="500" r="120" fill="#fb7185" fill-opacity="0.06"/>
  <!-- Heartbeat line -->
  <polyline points="440,310 480,310 520,260 560,350 600,250 640,350 680,260 700,310" stroke="#f43f5e" stroke-opacity="0.4" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Cross symbol -->
  <rect x="565" y="255" width="70" height="16" rx="3" fill="#fb7185" fill-opacity="0.3"/>
  <rect x="592" y="228" width="16" height="70" rx="3" fill="#fb7185" fill-opacity="0.3"/>
  <rect x="568" y="258" width="64" height="10" rx="2" fill="#fb7185" fill-opacity="0.5"/>
  <rect x="594" y="232" width="10" height="64" rx="2" fill="#fb7185" fill-opacity="0.5"/>
  <!-- Pulse dots -->
  <circle cx="520" cy="260" r="3" fill="#f43f5e" fill-opacity="0.5"/>
  <circle cx="600" cy="250" r="4" fill="#f43f5e" fill-opacity="0.6"/>
  <circle cx="680" cy="260" r="3" fill="#f43f5e" fill-opacity="0.5"/>
  <!-- Small floating hearts -->
  <path d="M310 200 Q310 190 318 190 Q326 190 326 200 Q326 200 318 212 Q310 200 310 200Z" fill="#f43f5e" fill-opacity="0.12"/>
  <path d="M890 380 Q890 370 898 370 Q906 370 906 380 Q906 380 898 392 Q890 380 890 380Z" fill="#f43f5e" fill-opacity="0.08"/>
  
</svg>
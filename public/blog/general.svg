<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#030f0a"/>
      <stop offset="50%" style="stop-color:#063320"/>
      <stop offset="100%" style="stop-color:#031a10"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#34d399;stop-opacity:0.1"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bg)"/>
  <circle cx="600" cy="300" r="300" fill="url(#accent)"/>
  <circle cx="200" cy="100" r="80" fill="#10b981" fill-opacity="0.08"/>
  <circle cx="1000" cy="500" r="120" fill="#34d399" fill-opacity="0.06"/>
  <!-- Compass / Navigation -->
  <g transform="translate(600,280)">
    <!-- Compass circle -->
    <circle cx="0" cy="0" r="55" fill="none" stroke="#10b981" stroke-opacity="0.25" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="#10b981" stroke-opacity="0.12" stroke-width="0.8"/>
    <!-- Cardinal directions -->
    <text x="0" y="-42" text-anchor="middle" font-size="14" font-weight="bold" fill="#34d399" fill-opacity="0.5" font-family="system-ui">N</text>
    <text x="0" y="52" text-anchor="middle" font-size="14" font-weight="bold" fill="#34d399" fill-opacity="0.35" font-family="system-ui">S</text>
    <text x="47" y="5" text-anchor="middle" font-size="14" font-weight="bold" fill="#34d399" fill-opacity="0.35" font-family="system-ui">E</text>
    <text x="-47" y="5" text-anchor="middle" font-size="14" font-weight="bold" fill="#34d399" fill-opacity="0.35" font-family="system-ui">W</text>
    <!-- Compass needle -->
    <polygon points="0,-35 6,0 0,35 -6,0" fill="#10b981" fill-opacity="0.25"/>
    <polygon points="0,-35 6,0 0,10" fill="#34d399" fill-opacity="0.35"/>
    <circle cx="0" cy="0" r="4" fill="#34d399" fill-opacity="0.5"/>
  </g>
  <!-- Path / Road going forward -->
  <path d="M470 370 L510 340 L600 300 L690 340 L730 370" fill="none" stroke="#34d399" stroke-opacity="0.1" stroke-width="2" stroke-dasharray="4,4"/>
  <path d="M500 370 L550 320 L600 290 L650 320 L700 370" fill="none" stroke="#10b981" stroke-opacity="0.08" stroke-width="1.5" stroke-dasharray="3,3"/>
  
</svg>
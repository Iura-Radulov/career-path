<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0a00"/>
      <stop offset="50%" style="stop-color:#3d2800"/>
      <stop offset="100%" style="stop-color:#1a1000"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:0.1"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bg)"/>
  <circle cx="600" cy="300" r="300" fill="url(#accent)"/>
  <circle cx="200" cy="100" r="80" fill="#f59e0b" fill-opacity="0.08"/>
  <circle cx="1000" cy="500" r="120" fill="#fbbf24" fill-opacity="0.06"/>
  <!-- Large gear -->
  <g transform="translate(600,290)">
    <circle cx="0" cy="0" r="45" fill="none" stroke="#f59e0b" stroke-opacity="0.35" stroke-width="2"/>
    <circle cx="0" cy="0" r="28" fill="none" stroke="#f59e0b" stroke-opacity="0.2" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="8" fill="#fbbf24" fill-opacity="0.3"/>
    <!-- Gear teeth -->
    <g stroke="#f59e0b" stroke-opacity="0.3" stroke-width="3" stroke-linecap="round">
      <line x1="0" y1="-45" x2="0" y2="-56"/>
      <line x1="45" y1="0" x2="56" y2="0"/>
      <line x1="0" y1="45" x2="0" y2="56"/>
      <line x1="-45" y1="0" x2="-56" y2="0"/>
      <line x1="31.8" y1="-31.8" x2="39.6" y2="-39.6"/>
      <line x1="31.8" y1="31.8" x2="39.6" y2="39.6"/>
      <line x1="-31.8" y1="-31.8" x2="-39.6" y2="-39.6"/>
      <line x1="-31.8" y1="31.8" x2="-39.6" y2="39.6"/>
    </g>
  </g>
  <!-- Small gear -->
  <g transform="translate(520,270)">
    <circle cx="0" cy="0" r="22" fill="none" stroke="#fbbf24" stroke-opacity="0.25" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="12" fill="none" stroke="#fbbf24" stroke-opacity="0.15" stroke-width="1"/>
    <g stroke="#fbbf24" stroke-opacity="0.2" stroke-width="2" stroke-linecap="round">
      <line x1="0" y1="-22" x2="0" y2="-28"/>
      <line x1="22" y1="0" x2="28" y2="0"/>
      <line x1="0" y1="22" x2="0" y2="28"/>
      <line x1="-22" y1="0" x2="-28" y2="0"/>
    </g>
  </g>
  <!-- Blueprint grid lines -->
  <g stroke="#f59e0b" stroke-opacity="0.06" stroke-width="0.5">
    <line x1="400" y1="180" x2="800" y2="180"/>
    <line x1="400" y1="220" x2="800" y2="220"/>
    <line x1="400" y1="360" x2="800" y2="360"/>
    <line x1="400" y1="400" x2="800" y2="400"/>
    <line x1="450" y1="180" x2="450" y2="400"/>
    <line x1="750" y1="180" x2="750" y2="400"/>
  </g>
  
</svg>
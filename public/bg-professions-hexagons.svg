<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" fill="none">
  <defs>
    <linearGradient id="hBg" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stopColor="#020617" stopOpacity="1"/>
      <stop offset="40%" stopColor="#020617" stopOpacity="0.5"/>
      <stop offset="100%" stopColor="#020617" stopOpacity="0"/>
    </linearGradient>
    <linearGradient id="hexFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#10B981" stopOpacity="0.08"/>
      <stop offset="50%" stopColor="#34D399" stopOpacity="0.04"/>
      <stop offset="100%" stopColor="#059669" stopOpacity="0.02"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#10B981" stopOpacity="0.05"/>
      <stop offset="50%" stopColor="#34D399" stopOpacity="0.25"/>
      <stop offset="100%" stopColor="#10B981" stopOpacity="0.05"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="glowBig">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>

  <!-- Base -->
  <rect width="1920" height="1080" fill="#020617"/>

  <!-- Ambient glows -->
  <circle cx="960" cy="300" r="350" fill="#10B981" opacity="0.05" filter="url(#glowBig)"/>
  <circle cx="200" cy="700" r="250" fill="#34D399" opacity="0.04" filter="url(#glowBig)"/>
  <circle cx="1700" cy="200" r="200" fill="#059669" opacity="0.04" filter="url(#glowBig)"/>

  <!-- Central hexagon cluster -->
  <g transform="translate(960, 320)" opacity="0.7">
    <!-- Center hex -->
    <polygon points="0,-120 104,-60 104,60 0,120 -104,60 -104,-60" stroke="#10B981" strokeWidth="1.2" fill="url(#hexFill)" opacity="0.5"/>
    
    <!-- Ring of 6 hexagons -->
    <polygon points="0,-240 104,-180 104,-60 0,0 -104,-60 -104,-180" stroke="#34D399" strokeWidth="0.8" fill="none" opacity="0.4"/>
    <polygon points="180,-120 180,0 104,60 0,0 0,-120 104,-180" stroke="#10B981" strokeWidth="0.8" fill="none" opacity="0.35"/>
    <polygon points="180,120 104,180 0,120 0,0 104,-60 104,60" stroke="#6EE7B7" strokeWidth="0.8" fill="none" opacity="0.3"/>
    <polygon points="0,240 -104,180 -104,60 0,0 104,60 104,120" stroke="#34D399" strokeWidth="0.8" fill="none" opacity="0.3"/>
    <polygon points="-180,120 -180,0 -104,-60 0,0 0,120 -104,180" stroke="#10B981" strokeWidth="0.8" fill="none" opacity="0.35"/>
    <polygon points="-180,-120 -104,-180 0,-120 0,0 -104,-60 -104,60" stroke="#6EE7B7" strokeWidth="0.8" fill="none" opacity="0.3"/>
  </g>

  <!-- Secondary hex cluster - bottom left -->
  <g transform="translate(300, 680)" opacity="0.4">
    <polygon points="0,-80 69,-40 69,40 0,80 -69,40 -69,-40" stroke="#34D399" strokeWidth="1" fill="url(#hexFill)"/>
    <polygon points="138,0 138,80 69,120 0,80 0,0 69,-40" stroke="#10B981" strokeWidth="0.6" fill="none"/>
    <polygon points="0,80 69,120 69,200 0,240 -69,200 -69,120" stroke="#6EE7B7" strokeWidth="0.6" fill="none"/>
  </g>

  <!-- Hex - top right -->
  <g transform="translate(1600, 180)" opacity="0.35">
    <polygon points="0,-60 52,-30 52,30 0,60 -52,30 -52,-30" stroke="#10B981" strokeWidth="0.8" fill="url(#hexFill)"/>
  </g>

  <!-- Small scattered hexagons -->
  <g opacity="0.3">
    <g transform="translate(180, 250)">
      <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15" stroke="#34D399" strokeWidth="0.6" fill="none"/>
      <circle cx="0" cy="0" r="4" fill="#10B981" opacity="0.3"/>
    </g>
    <g transform="translate(650, 130)">
      <polygon points="0,-22 19,-11 19,11 0,22 -19,11 -19,-11" stroke="#6EE7B7" strokeWidth="0.5" fill="none"/>
    </g>
    <g transform="translate(1300, 600)">
      <polygon points="0,-35 30,-17 30,17 0,35 -30,17 -30,-17" stroke="#10B981" strokeWidth="0.6" fill="none"/>
    </g>
    <g transform="translate(1700, 650)">
      <polygon points="0,-25 22,-12 22,12 0,25 -22,12 -22,-12" stroke="#34D399" strokeWidth="0.5" fill="none"/>
    </g>
    <g transform="translate(500, 550)">
      <polygon points="0,-20 17,-10 17,10 0,20 -17,10 -17,-10" stroke="#6EE7B7" strokeWidth="0.5" fill="none"/>
    </g>
  </g>

  <!-- Connecting lines -->
  <g opacity="0.2">
    <line x1="180" y1="250" x2="650" y2="130" stroke="#34D399" strokeWidth="1"/>
    <line x1="960" y1="320" x2="1600" y2="180" stroke="#10B981" strokeWidth="1"/>
    <line x1="960" y1="320" x2="300" y2="680" stroke="#34D399" strokeWidth="0.8"/>
    <line x1="960" y1="320" x2="1300" y2="600" stroke="#10B981" strokeWidth="0.8"/>
    <line x1="650" y1="130" x2="1300" y2="600" stroke="#6EE7B7" strokeWidth="0.6"/>
  </g>

  <!-- Small dot nodes on intersections -->
  <g opacity="0.4">
    <circle cx="180" cy="250" r="3" fill="#34D399"/>
    <circle cx="650" cy="130" r="3" fill="#10B981"/>
    <circle cx="960" cy="320" r="5" fill="#34D399" filter="url(#glow)"/>
    <circle cx="1600" cy="180" r="3" fill="#10B981"/>
    <circle cx="300" cy="680" r="3" fill="#34D399"/>
    <circle cx="1300" cy="600" r="3" fill="#10B981"/>
  </g>

  <!-- Background particles -->
  <g opacity="0.15">
    <circle cx="400" cy="180" r="2" fill="#10B981"/>
    <circle cx="800" cy="100" r="1.5" fill="#34D399"/>
    <circle cx="1200" cy="150" r="2" fill="#6EE7B7"/>
    <circle cx="1800" cy="400" r="1.5" fill="#10B981"/>
    <circle cx="1500" cy="800" r="2" fill="#34D399"/>
  </g>

  <!-- Bottom fade -->
  <rect x="0" y="650" width="1920" height="430" fill="url(#hBg)"/>
</svg>
